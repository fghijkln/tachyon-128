name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    name: tcc128 tests + fuzz (golden simulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: assembler / disassembler round trips
        run: python3 tests/test_tools.py
      - name: C tests (-O and -O0)
        run: python3 cc/tests/run_tests.py --both
      - name: purecap C tests + capability-fault tests (-O, -O0)
        run: python3 cc/tests/run_tests.py --purecap && python3 cc/tests/run_tests.py --purecap -O0
      - name: differential fuzz vs gcc (fixed seeds)
        run: |
          cd cc/tests
          python3 fuzz.py 60 1
          python3 fuzz.py 30 1 -O0
          python3 fuzz.py 60 1 -mpurecap

  rtl:
    name: RTL (Verilator) lockstep vs golden model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (micromamba Verilator + g++)
        run: bash tb/setup_toolchain.sh
      - name: build
        run: source ~/env.sh && TX_JOBS=4 tb/build.sh
      - name: unit, programs, random
        run: |
          source ~/env.sh
          python3 tests/run_tests.py unit
          python3 tests/run_tests.py programs
          python3 tests/run_tests.py random 500 1
      - name: C benchmarks on RTL (default + purecap)
        run: |
          source ~/env.sh
          python3 cc/bench/run_bench.py --rtl
          python3 cc/bench/run_bench.py --rtl --purecap
